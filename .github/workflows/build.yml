name: Build Kiosk ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
      options: --privileged

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Software-Pakete installieren
        run: |
          apt-get update
          apt-get install -y live-build debootstrap debian-archive-keyring wget ca-certificates systemd

      - name: Build Kiosk Live ISO
        run: |
          mkdir -p kiosk_build
          cd kiosk_build

          # 1. Grundkonfiguration inkl. Firmware-Repos
          lb config \
            --architectures amd64 \
            --distribution bookworm \
            --archive-areas "main contrib non-free non-free-firmware" \
            --parent-archive-areas "main contrib non-free non-free-firmware" \
            --binary-images iso-hybrid

          # 2. Pakete definieren (nur Standard-Pakete ohne problematische Metapakete)
          mkdir -p config/package-lists
          cat << 'EOF' > config/package-lists/kiosk.list.chroot
          openbox
          nodm
          chromium
          xbindkeys
          zenity
          network-manager
          lxterminal
          wget
          sudo
          EOF

          # 3. Auto-Login einrichten
          mkdir -p config/includes.chroot/etc/default
          echo 'NODM_ENABLED=true' > config/includes.chroot/etc/default/nodm
          echo 'NODM_USER=kiosk' >> config/includes.chroot/etc/default/nodm
          echo 'NODM_MIN_SESSION_TIME=60' >> config/includes.chroot/etc/default/nodm
          echo 'NODM_XSESSION=/etc/X11/Xsession' >> config/includes.chroot/etc/default/nodm

          # 4. Kiosk-Autostart einrichten
          mkdir -p config/includes.chroot/etc/skel/.config/openbox
          cat << 'EOF' > config/includes.chroot/etc/skel/.config/openbox/autostart
          #!/bin/bash
          xset -dpms; xset s off; xset s noblank
          [ ! -f ~/.kiosk-url ] && echo "https://tipslinz.netlify.app" > ~/.kiosk-url
          xbindkeys &
          wget -q --spider http://google.com || lxterminal -e nmtui
          chromium --kiosk --no-first-run --disable-restore-session-state $(cat ~/.kiosk-url) &
          EOF
          chmod +x config/includes.chroot/etc/skel/.config/openbox/autostart

          echo "exec openbox-session" > config/includes.chroot/etc/skel/.xsession

          # 5. Tastatur-Shortcuts
          cat << 'EOF' > config/includes.chroot/etc/skel/.xbindkeysrc
          "systemctl poweroff"
            alt + Return
          "killall chromium && sleep 1 && chromium --kiosk --no-first-run --disable-restore-session-state $(cat ~/.kiosk-url) &"
            alt + r
          "lxterminal -e nmtui && zenity --entry --title=\"Setup\" --text=\"URL:\" --entry-text=$(cat ~/.kiosk-url) > ~/.kiosk-url && killall chromium && chromium --kiosk --no-first-run --disable-restore-session-state $(cat ~/.kiosk-url) &"
            Mod5 + 0
          EOF

          # 6. Benutzer anlegen
          mkdir -p config/hooks/live
          cat << 'EOF' > config/hooks/live/0100-user.hook.chroot
          #!/bin/sh
          useradd -m -s /bin/bash kiosk
          cp -r /etc/skel/. /home/kiosk/
          chown -R kiosk:kiosk /home/kiosk
          EOF
          chmod +x config/hooks/live/0100-user.hook.chroot

          # 7. ISO bauen
          lb build

      - name: ISO als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: TipsLinz-Kiosk-ISO
          path: kiosk_build/*.iso
